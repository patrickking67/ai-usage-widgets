name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: scripts/check.sh
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install xcodegen shellcheck actionlint
      - name: Check
        run: scripts/check.sh

  windows:
    name: Windows core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Core tests on Windows
        shell: pwsh
        run: pwsh -NoProfile -File apps/windows/tests/Core.Tests.ps1
